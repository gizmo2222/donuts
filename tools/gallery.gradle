// Gradle init script used by tools\gallery.ps1: passes the output folder to the ScreenGallery test as the
// system property donuts.gallery, and makes the test task re-run every time. app\build.gradle is unchanged.
allprojects {
    tasks.withType(Test).configureEach { t ->
        def dir = System.getProperty('donuts.gallery.dir', '')
        t.systemProperty 'donuts.gallery', dir
        t.outputs.upToDateWhen { false }
    }
}
