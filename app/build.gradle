plugins {
    id 'com.android.application'
    id 'com.github.triplet.play'
}

// Load signing credentials from local.properties (never committed to git)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localProps.load(localPropsFile.newDataInputStream())

android {
    namespace = 'com.donuts.game'
    compileSdk 36

    defaultConfig {
        applicationId "com.donuts.game"
        minSdk 26
        targetSdk 36
        versionCode 33
        versionName "2.0.1"
    }

    signingConfigs {
        release {
            storeFile     file(localProps['KEYSTORE_PATH'] ?: 'donuts-release.jks')
            storePassword localProps['KEYSTORE_PASSWORD'] ?: ''
            keyAlias      localProps['KEY_ALIAS']         ?: 'donuts'
            keyPassword   localProps['KEY_PASSWORD']      ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig   = signingConfigs.release
            minifyEnabled   = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Google Play upload (Gradle Play Publisher): .\gradlew.bat publishReleaseBundle
// builds the signed bundle and uploads it to the closed testing track. The service-account
// key lives outside git; its path comes from PLAY_SERVICE_ACCOUNT_JSON in local.properties.
play {
    serviceAccountCredentials.set(rootProject.file(localProps['PLAY_SERVICE_ACCOUNT_JSON'] ?: 'play-service-account.json'))
    track.set('alpha')
    defaultToAppBundles.set(true)
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
