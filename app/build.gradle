plugins {
    id 'com.android.application'
}

// Load signing credentials from local.properties (never committed to git)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localProps.load(localPropsFile.newDataInputStream())

android {
    namespace 'com.donuts.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.donuts.game"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile     file(localProps['KEYSTORE_PATH'] ?: 'donuts-release.jks')
            storePassword localProps['KEYSTORE_PASSWORD'] ?: ''
            keyAlias      localProps['KEY_ALIAS']         ?: 'donuts'
            keyPassword   localProps['KEY_PASSWORD']      ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig   signingConfigs.release
            minifyEnabled   true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
